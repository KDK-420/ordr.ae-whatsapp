# Set up or redeploy the VPS over SSH from a GitHub-hosted runner. Run from the Actions tab.
#
# Authentication to the server, in order of preference:
#   secrets.VPS_SSH_KEY   private key (ed25519 recommended). Its public half is authorized on
#                         the server during the first run that still uses the password.
#   secrets.VPS_PASSWORD  root password, used when no key secret exists or the key is not yet
#                         authorized. Only passed to sshpass through the environment; masked.
#
# Every run authorizes public keys on the server for root: the keys published on the GitHub
# accounts of the actor and the repository owner (github.com/<user>.keys), vars.SSH_PUBLIC_KEYS
# (one per line) and the ssh_public_key input.
#
# Optional secrets written into deploy/.env on the server when present (every run; empty ones
# never blank a value already there):
#   META_APP_SECRET, META_VERIFY_TOKEN, AUTH_SECRET, ANTHROPIC_API_KEY, SEED_PHONE_NUMBER_ID,
#   SEED_WABA_ID, SEED_DISPLAY_PHONE, SEED_ACCESS_TOKEN, SEED_TENANT_NAME, SEED_ADMIN_EMAIL,
#   SEED_ADMIN_PASSWORD
#
# The seed input switches the demo tenant between verticals: it writes SEED_BLUEPRINT_ID (and a
# matching SEED_TENANT_NAME unless the secret sets one) and reseeds, moving the WhatsApp number
# and the dashboard owner to that tenant.
name: VPS

on:
  workflow_dispatch:
    inputs:
      host:
        description: Server IP or hostname for SSH
        default: 200.141.6.31
        required: true
      domain:
        description: Public hostname for TLS (its A record must point at the server)
        default: app.ordr.ae
        required: true
      mode:
        description: setup = bootstrap + config + deploy --seed; deploy = build and restart only
        type: choice
        options: [setup, deploy]
        default: setup
      ssh_public_key:
        description: Extra public key to authorize for root (optional)
        default: ""
      disable_password_auth:
        description: Turn off SSH password login (only allowed when this run connected with a key)
        type: boolean
        default: false
      seed:
        description: Reseed the demo tenant as this vertical (no = leave data alone; setup mode always seeds)
        type: choice
        options: ["no", restaurant, salon, retail]
        default: "no"

concurrency:
  group: vps-${{ inputs.host || '200.141.6.31' }}
  cancel-in-progress: false

jobs:
  vps:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HOST: ${{ inputs.host || '200.141.6.31' }}
      DOMAIN: ${{ inputs.domain || 'app.ordr.ae' }}
      MODE: ${{ inputs.mode || 'setup' }}
      DISABLE_PASSWORD_AUTH: ${{ inputs.disable_password_auth || 'false' }}
      SEED_VERTICAL: ${{ inputs.seed || 'no' }}
      BRANCH: ${{ github.ref_name }}
      SSHPASS: ${{ secrets.VPS_PASSWORD }}
      SSH_OPTS: -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20
    steps:
      - uses: actions/checkout@v4

      - name: Prepare SSH client
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          auth=""
          if [ -n "$VPS_SSH_KEY" ]; then
            printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key && chmod 600 ~/.ssh/vps_key
            ssh-keygen -y -f ~/.ssh/vps_key > ~/.ssh/vps_key.pub
            echo "VPS_SSH_KEY secret present: $(ssh-keygen -l -f ~/.ssh/vps_key.pub)"
            key_ssh="ssh -i $HOME/.ssh/vps_key -o IdentitiesOnly=yes -o BatchMode=yes $SSH_OPTS"
            if $key_ssh "root@$HOST" true 2>/dev/null; then
              auth=key
              echo "SSH=$key_ssh" >> "$GITHUB_ENV"
            else
              echo "::notice::The VPS_SSH_KEY key is not authorized on the server yet; this run uses the password and authorizes it."
            fi
          fi
          if [ -z "$auth" ]; then
            if [ -z "$SSHPASS" ]; then
              echo "::error::No usable credentials: add secret VPS_SSH_KEY (private key) or VPS_PASSWORD (root password)."
              exit 1
            fi
            sudo apt-get update -qq && sudo apt-get install -y -qq sshpass >/dev/null
            auth=password
            echo "SSH=sshpass -e ssh -o PreferredAuthentications=password -o PubkeyAuthentication=no $SSH_OPTS" >> "$GITHUB_ENV"
          fi
          echo "AUTH=$auth" >> "$GITHUB_ENV"
          echo "Connecting with: $auth"

      - name: Check SSH access and DNS
        run: |
          set -euo pipefail
          $SSH "root@$HOST" 'echo "connected to $(hostname) as $(whoami) on $(. /etc/os-release && echo "$PRETTY_NAME")"'
          resolved="$(getent ahostsv4 "$DOMAIN" | awk '{print $1}' | sort -u | tr '\n' ' ')"
          echo "$DOMAIN resolves to: ${resolved:-nothing}"
          server_ip="$(getent ahostsv4 "$HOST" | awk '{print $1}' | head -1)"
          if [ -z "$resolved" ]; then
            echo "::error::$DOMAIN does not resolve. Create an A record pointing at $server_ip, then rerun."
            exit 1
          fi
          case " $resolved " in
            *" $server_ip "*) echo "DNS OK: $DOMAIN -> $server_ip" ;;
            *) echo "::error::$DOMAIN resolves to $resolved but the server is $server_ip. Fix the A record (and disable any proxying) then rerun."; exit 1 ;;
          esac

      - name: Authorize SSH keys for root
        env:
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
          INPUT_KEY: ${{ inputs.ssh_public_key }}
          VAR_KEYS: ${{ vars.SSH_PUBLIC_KEYS }}
        run: |
          set -euo pipefail
          keys="$(mktemp)"
          for u in "$ACTOR" "$OWNER"; do
            got="$(curl -fsS --max-time 15 "https://github.com/$u.keys" || true)"
            if [ -n "$got" ]; then printf '%s\n' "$got" | sed "s|\$| github:$u|" >> "$keys"; echo "github.com/$u: $(printf '%s\n' "$got" | grep -c .) key(s)"; else echo "github.com/$u: no public keys"; fi
          done
          [ -n "$INPUT_KEY" ] && printf '%s\n' "$INPUT_KEY" >> "$keys"
          [ -n "$VAR_KEYS" ] && printf '%s\n' "$VAR_KEYS" >> "$keys"
          [ -f ~/.ssh/vps_key.pub ] && sed 's|$| github-actions-vps|' ~/.ssh/vps_key.pub >> "$keys"
          valid="$(mktemp)"
          while IFS= read -r line; do
            [ -n "$line" ] || continue
            if printf '%s\n' "$line" > "$valid.one" && ssh-keygen -l -f "$valid.one" >/dev/null 2>&1; then
              printf '%s\n' "$line" >> "$valid"
            else
              echo "::warning::Skipping an invalid public key line"
            fi
          done < "$keys"
          sort -u "$valid" -o "$valid"
          if [ ! -s "$valid" ]; then
            echo "::notice::No public keys to authorize. Add keys to your GitHub account, the SSH_PUBLIC_KEYS variable, or the ssh_public_key input."
            exit 0
          fi
          echo "Authorizing $(grep -c . "$valid") key(s):"; ssh-keygen -l -f "$valid"
          $SSH "root@$HOST" 'umask 077; mkdir -p ~/.ssh; touch ~/.ssh/authorized_keys; chmod 700 ~/.ssh; chmod 600 ~/.ssh/authorized_keys
            added=0; while IFS= read -r line; do
              kf="$(printf "%s" "$line" | awk "{print \$1\" \"\$2}")"
              grep -qF -- "$kf" ~/.ssh/authorized_keys || { printf "%s\n" "$line" >> ~/.ssh/authorized_keys; added=$((added+1)); }
            done
            echo "authorized_keys: $added added, $(grep -c . ~/.ssh/authorized_keys) total"' < "$valid"

      - name: Bootstrap server
        if: env.MODE == 'setup'
        run: |
          $SSH "root@$HOST" "BRANCH='$BRANCH' bash -s" < deploy/bootstrap.sh

      # Runs in both modes so a secret added or changed in GitHub reaches the server on the next deploy.
      # Empty secrets are skipped, so values already on the server are never blanked.
      - name: Write deploy/.env on the server
        env:
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          META_VERIFY_TOKEN: ${{ secrets.META_VERIFY_TOKEN }}
          # Voice notes: an OpenAI key turns transcription on. TRANSCRIPTION_API_KEY wins; OPENAI_KEY is the older name.
          TRANSCRIPTION_API_KEY: ${{ secrets.TRANSCRIPTION_API_KEY || secrets.OPENAI_KEY }}
          # Push notifications to staff phones: both VAPID keys, from `pnpm --filter @ordr/api push:keys`.
          WEB_PUSH_PUBLIC_KEY: ${{ secrets.WEB_PUSH_PUBLIC_KEY }}
          WEB_PUSH_PRIVATE_KEY: ${{ secrets.WEB_PUSH_PRIVATE_KEY }}
          WEB_PUSH_SUBJECT: ${{ secrets.WEB_PUSH_SUBJECT }}
          SEED_TENANT_NAME: ${{ secrets.SEED_TENANT_NAME }}
          SEED_PHONE_NUMBER_ID: ${{ secrets.SEED_PHONE_NUMBER_ID }}
          SEED_WABA_ID: ${{ secrets.SEED_WABA_ID }}
          SEED_DISPLAY_PHONE: ${{ secrets.SEED_DISPLAY_PHONE }}
          SEED_ACCESS_TOKEN: ${{ secrets.SEED_ACCESS_TOKEN }}
          SEED_ADMIN_EMAIL: ${{ secrets.SEED_ADMIN_EMAIL }}
          SEED_ADMIN_PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
        run: |
          set -euo pipefail
          # Build a script for the server. setkv replaces or appends KEY="value" in deploy/.env,
          # escaping backslashes and double quotes for the file. Values travel bash-quoted (printf %q).
          script='set -euo pipefail; cd /opt/ordr/deploy
          setkv() { { grep -v "^$1=" .env || true; } > .env.tmp; printf "%s=\"%s\"\n" "$1" "$(printf "%s" "$2" | sed "s/[\\\\\"]/\\\\&/g")" >> .env.tmp; mv .env.tmp .env; chmod 600 .env; }
          '
          add() {  # $1 key, $2 value; skipped when empty
            [ -n "$2" ] || return 0
            script+="setkv $1 $(printf %q "$2")"$'\n'
          }
          add DOMAIN "$DOMAIN"
          add META_APP_SECRET "$META_APP_SECRET"
          add META_VERIFY_TOKEN "$META_VERIFY_TOKEN"
          add SEED_TENANT_NAME "$SEED_TENANT_NAME"
          add SEED_PHONE_NUMBER_ID "$SEED_PHONE_NUMBER_ID"
          add SEED_WABA_ID "$SEED_WABA_ID"
          add SEED_DISPLAY_PHONE "$SEED_DISPLAY_PHONE"
          add SEED_ACCESS_TOKEN "$SEED_ACCESS_TOKEN"
          add SEED_ADMIN_EMAIL "$SEED_ADMIN_EMAIL"
          add SEED_ADMIN_PASSWORD "$SEED_ADMIN_PASSWORD"
          add AUTH_SECRET "$AUTH_SECRET"
          add WEB_PUSH_PUBLIC_KEY "$WEB_PUSH_PUBLIC_KEY"
          add WEB_PUSH_PRIVATE_KEY "$WEB_PUSH_PRIVATE_KEY"
          add WEB_PUSH_SUBJECT "$WEB_PUSH_SUBJECT"
          add ANTHROPIC_API_KEY "$ANTHROPIC_API_KEY"
          if [ -n "$TRANSCRIPTION_API_KEY" ]; then
            add TRANSCRIPTION_API_KEY "$TRANSCRIPTION_API_KEY"
            add TRANSCRIPTION_PROVIDER openai
          fi
          add PUBLIC_BASE_URL "https://$DOMAIN"
          if [ "$SEED_VERTICAL" != "no" ]; then
            add SEED_BLUEPRINT_ID "$SEED_VERTICAL"
            case "$SEED_VERTICAL" in
              salon) [ -n "$SEED_TENANT_NAME" ] || add SEED_TENANT_NAME "Demo Salon" ;;
              restaurant) [ -n "$SEED_TENANT_NAME" ] || add SEED_TENANT_NAME "Demo Restaurant" ;;
              retail) [ -n "$SEED_TENANT_NAME" ] || add SEED_TENANT_NAME "Demo Shop" ;;
            esac
          fi
          # The landing page links to the seeded tenant's web chat unless DEMO_CHAT_SLUG is already set on the server.
          script+='grep -q "^DEMO_CHAT_SLUG=" .env || setkv DEMO_CHAT_SLUG "$(grep "^SEED_TENANT_NAME=" .env | cut -d= -f2- | tr -d "\"" | tr "[:upper:]" "[:lower:]" | sed "s/[^a-z0-9]\+/-/g")"'$'\n'
          if [ -z "$META_APP_SECRET" ] && [ "$MODE" = "setup" ]; then
            # Placeholder so the stack can start; webhook signatures will not verify until replaced.
            script+='grep -q "^META_APP_SECRET=\"\?replace-me" .env && setkv META_APP_SECRET "not-configured-$(openssl rand -hex 8)" || true'$'\n'
            echo "::warning::META_APP_SECRET secret not set; a placeholder was written. Put the real value in /opt/ordr/deploy/.env or add the secret and rerun."
          fi
          script+='echo "deploy/.env keys: $(grep -v "^#" .env | cut -d= -f1 | grep . | sort | tr "\n" " ")"'$'\n'
          $SSH "root@$HOST" 'bash -s' <<< "$script"

      - name: Deploy
        run: |
          flags="--no-pull"
          if [ "$MODE" = "setup" ] || [ "$SEED_VERTICAL" != "no" ]; then flags="--no-pull --seed"; fi
          $SSH "root@$HOST" "cd /opt/ordr && git fetch --quiet origin '$BRANCH' && git checkout --quiet '$BRANCH' && git reset --quiet --hard 'origin/$BRANCH' && chmod +x deploy/*.sh && ./deploy/deploy.sh $flags"

      - name: Disable SSH password login
        if: env.DISABLE_PASSWORD_AUTH == 'true'
        run: |
          set -euo pipefail
          if [ "$AUTH" != "key" ]; then
            echo "::error::Refusing to disable password login: this run connected with the password. Add VPS_SSH_KEY, rerun once so the key is authorized and used, then rerun with disable_password_auth."
            exit 1
          fi
          $SSH "root@$HOST" 'set -e
            [ -s ~/.ssh/authorized_keys ] || { echo "no authorized keys for root, refusing"; exit 1; }
            mkdir -p /etc/ssh/sshd_config.d
            printf "PasswordAuthentication no\nKbdInteractiveAuthentication no\nPubkeyAuthentication yes\n" > /etc/ssh/sshd_config.d/00-ordr.conf
            sshd -t
            systemctl restart ssh 2>/dev/null || systemctl restart sshd
            echo "password login disabled"'
          $SSH "root@$HOST" 'echo "key login still works after restart"'

      - name: Verify over HTTPS
        run: |
          for i in $(seq 1 20); do
            out="$(curl -fsS --max-time 10 "https://$DOMAIN/health" 2>/dev/null || true)"
            dash="$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "https://$DOMAIN/login" || true)"
            if [ -n "$out" ] && [ "$dash" = "200" ]; then
              echo "https://$DOMAIN/health -> $out"
              echo "https://$DOMAIN/login -> HTTP $dash"
              ai="$($SSH "root@$HOST" 'cd /opt/ordr/deploy && docker compose logs --no-log-prefix api 2>/dev/null | grep -o "AI assistant[^\"]*" | tail -1' 2>/dev/null || true)"
              tenant="$($SSH "root@$HOST" 'cd /opt/ordr/deploy && docker compose exec -T postgres psql -U ordr ordr -Atc "select name || '"'"' ('"'"' || \"blueprintId\" || '"'"')'"'"' from \"Tenant\" order by \"createdAt\" desc limit 1"' 2>/dev/null || true)"
              echo "assistant: ${ai:-unknown}; newest tenant: ${tenant:-unknown}"
              # Web chat smoke test against the seeded tenant: start a session and say hi; prints the assistant's first reply.
              slug="$($SSH "root@$HOST" 'cd /opt/ordr/deploy && grep "^DEMO_CHAT_SLUG=" .env | cut -d= -f2- | tr -d "\""' 2>/dev/null || true)"
              chat="not tried"
              if [ -n "$slug" ]; then
                session="$(curl -s --max-time 20 -H 'content-type: application/json' -d "{\"slug\":\"$slug\"}" "https://$DOMAIN/v1/chat/sessions" || true)"
                sid="$(printf '%s' "$session" | sed -n 's/.*"sessionId":"\([^"]*\)".*/\1/p')"
                tok="$(printf '%s' "$session" | sed -n 's/.*"token":"\([^"]*\)".*/\1/p')"
                if [ -n "$sid" ] && [ -n "$tok" ]; then
                  reply="$(curl -s --max-time 90 -H 'content-type: application/json' -H "authorization: Bearer $tok" -d '{"text":"hi"}' "https://$DOMAIN/v1/chat/sessions/$sid/messages" || true)"
                  chat="$(printf '%s' "$reply" | sed -n 's/.*"role":"assistant","text":"\([^"]*\)".*/\1/p' | tail -c 160)"
                  [ -n "$chat" ] || chat="no assistant reply (response: $(printf '%s' "$reply" | head -c 200))"
                else
                  chat="session not created for slug '$slug' (response: $(printf '%s' "$session" | head -c 200))"
                fi
              fi
              echo "web chat ($slug): $chat"
              { echo "### VPS ready"; echo "- Dashboard: https://$DOMAIN/login"; echo "- Web chat: https://$DOMAIN/chat/${slug:-<tenant-slug>}"; echo "- Health: https://$DOMAIN/health"; echo "- Webhook callback URL: https://$DOMAIN/webhooks/whatsapp"; echo "- Assistant: ${ai:-unknown}"; echo "- Newest tenant: ${tenant:-unknown}"; echo "- Web chat smoke test: ${chat}"; echo "- SSH: ssh root@$HOST (auth this run: $AUTH)"; } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 6
          done
          echo "::error::Not reachable as expected: health='${out:-no answer}', /login HTTP ${dash:-none}. On the server: cd /opt/ordr/deploy && docker compose ps && docker compose logs caddy dashboard"
          exit 1
