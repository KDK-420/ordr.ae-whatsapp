# Publish website/ to ordr.ae, pos.ordr.ae and booking.ordr.ae. Caddy serves the folder straight from the checkout on the server, so
# this updates only those files: no build, no container restart, and the app is not touched.
name: Website

on:
  push:
    branches: [main]
    paths:
      - website/**
      - .github/workflows/website.yml
  workflow_dispatch:

# Shares the group with vps.yml, so the two never change the checkout at the same time.
concurrency:
  group: vps-200.141.6.31
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HOST: 200.141.6.31
    steps:
      - name: Update the files on the server
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key && chmod 600 ~/.ssh/vps_key
          # The fetch reaches GitHub from the server, which has timed out before, so try a few times.
          for attempt in 1 2 3; do
            if ssh -i ~/.ssh/vps_key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 "root@$HOST" \
              "cd /opt/ordr && git fetch --quiet origin main && git restore --source=origin/main --staged --worktree -- website"; then
              exit 0
            fi
            echo "attempt $attempt failed"
            sleep 15
          done
          exit 1

      - name: Check the live site
        run: |
          set -euo pipefail
          page="$(curl -fsS --max-time 20 "https://ordr.ae/?v=$GITHUB_SHA")"
          case "$page" in *ordr.ae*) ;; *) echo "::error::https://ordr.ae/ did not return the site"; exit 1 ;; esac
          curl -fsS -o /dev/null --max-time 20 https://ordr.ae/ar/
          curl -fsS -o /dev/null --max-time 20 https://ordr.ae/assets/styles.css
          curl -fsS -o /dev/null --max-time 20 https://pos.ordr.ae/
          curl -fsS -o /dev/null --max-time 20 https://booking.ordr.ae/
          curl -fsS -o /dev/null --max-time 20 https://booking.ordr.ae/assets/styles.css
