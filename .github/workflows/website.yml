# Publish website/ to the `hostinger` branch, which Hostinger's Git deployment checks out into
# the ordr.ae web root (hPanel: Websites, ordr.ae, Advanced, Git; branch `hostinger`, auto-deployment on).
# Hostinger runs no build and must never deploy `main`, which would put the whole monorepo in public_html.
name: Website

on:
  push:
    branches: [main]
    paths:
      - website/**
      - .github/workflows/website.yml
  workflow_dispatch:

concurrency:
  group: website
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the site
        run: test -f website/index.html && test -f website/ar/index.html && test -f website/assets/styles.css
      - name: Push the site to the hostinger branch
        working-directory: website
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm README.md
          git init -q -b hostinger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7} from ${GITHUB_REF_NAME}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" hostinger
